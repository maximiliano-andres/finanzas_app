# Stack aislado para pruebas E2E reales: React -> API -> Backend -> PostgreSQL/Redis -> UI
# Uso: docker compose -p flujopago-e2e -f e2e/docker-compose.e2e.yml --env-file e2e/.env.e2e up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "56379:6379"

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "58025:8025"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env.e2e
    environment:
      APP_ENV: development
    volumes:
      - ..:/code
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
